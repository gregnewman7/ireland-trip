<style>
  :root{
    --bg: #efe7d4;
    --bg-card: #f7f1e3;
    --ink: #23301d;
    --ink-soft: #5a5c4e;
    --green: #33502e;
    --green-deep: #223a1f;
    --gold: #b8862e;
    --rust: #a3452a;
    --line: #cdc2a1;
    --line-soft: #ddd4b8;
    --white: #fffdf7;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); }
  body{
    font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 64px;
  }
  h1,h2,h3{ font-family:'Fraunces', Georgia, serif; margin:0; font-weight:600; }

  /* ---------- Header ---------- */
  header{
    background: var(--green-deep);
    color: var(--white);
    padding: 22px 18px 18px;
    position: relative;
    overflow: hidden;
  }
  header .map-motif{
    position:absolute; right:-30px; top:-20px; width:190px; height:190px;
    opacity:0.10; pointer-events:none;
  }
  header h1{
    font-size: 1.7rem;
    letter-spacing: 0.01em;
    position: relative; z-index:1;
  }
  header .sub{
    font-size: 0.92rem;
    color: #d9d3bd;
    margin-top: 4px;
    position: relative; z-index:1;
  }

  /* ---------- Day pill scroller ---------- */
  nav.days{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding: 12px 14px;
    background: var(--green);
    scrollbar-width:none;
    position: sticky;
    top:0;
    z-index: 20;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  nav.days::-webkit-scrollbar{ display:none; }
  nav.days button{
    flex: 0 0 auto;
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size: 0.92rem;
    background: rgba(255,255,255,0.08);
    color: #eae4cd;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 10px;
    padding: 10px 15px;
    cursor:pointer;
    white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease;
  }
  nav.days button.active{
    background: var(--gold);
    border-color: var(--gold);
    color: #2a2005;
  }
  nav.days button.overview-btn{
    background: transparent;
    border: 1px solid rgba(255,255,255,0.35);
  }
  nav.days button.overview-btn.active{
    background: var(--white);
    color: var(--green-deep);
    border-color: var(--white);
  }

  main{ max-width: 640px; margin: 0 auto; padding: 18px 16px 10px; }

  /* ---------- Day header block ---------- */
  .day-head{
    margin-bottom: 18px;
  }
  .day-head .kicker{
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--rust);
    letter-spacing: 0.02em;
  }
  .day-head .kicker.travel{ color: var(--gold); }
  .day-head h2{ font-size: 1.5rem; margin-top: 2px; color: var(--green-deep); }
  .day-head .note{
    margin-top: 8px;
    font-size: 0.97rem;
    color: var(--ink-soft);
    line-height: 1.55;
  }

  /* ---------- Stay card ---------- */
  .stay-card{
    display:flex;
    gap: 12px;
    align-items:flex-start;
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 13px 14px;
    margin-bottom: 20px;
  }
  .stay-card svg{ flex:0 0 auto; margin-top:2px; }
  .stay-card .label{ font-size:0.78rem; font-weight:600; color:var(--ink-soft); text-transform: none; }
  .stay-card .name{ font-family:'Fraunces', serif; font-size:1.08rem; font-weight:600; color:var(--green-deep); margin-top:1px;}
  .stay-card .addr{ font-size:0.86rem; color:var(--ink-soft); margin-top:2px; }
  .stay-card .maplinks{ margin-top:6px; font-size:0.84rem; }
  .stay-card .maplinks a{ color:var(--green); font-weight:600; text-decoration:none; }
  .stay-card .maplinks a:not(:last-child)::after{ content:"  ·  "; color: var(--line); font-weight:400; }

  /* ---------- Section ---------- */
  section.block{ margin-bottom: 24px; }
  .block-title{
    display:flex; align-items:center; gap:8px;
    font-size: 1.02rem;
    font-weight: 700;
    color: var(--green-deep);
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line-soft);
  }
  .block-title svg{ flex: 0 0 auto; }

  .enroute-tag{
    display:inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--rust);
    background: rgba(163,69,42,0.09);
    border: 1px solid rgba(163,69,42,0.25);
    padding: 2px 8px;
    border-radius: 20px;
    margin-bottom: 10px;
    letter-spacing: 0.01em;
  }

  /* ---------- Place card ---------- */
  .place{
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 13px 14px;
    margin-bottom: 10px;
    background: var(--white);
  }
  .place .pname{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: 1.05rem;
    color: var(--green-deep);
    margin-bottom: 2px;
  }
  .place .paddr{
    font-size: 0.83rem;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .place .pdesc{
    font-size: 0.93rem;
    color: var(--ink);
    line-height: 1.5;
    margin-bottom: 8px;
  }
  .place .plinks{ font-size: 0.85rem; }
  .place .plinks a{
    color: var(--green);
    font-weight: 600;
    text-decoration: none;
    margin-right: 14px;
    display: inline-block;
  }
  .place .plinks a:hover{ text-decoration: underline; }

  .empty-note{
    font-size: 0.92rem;
    color: var(--ink-soft);
    font-style: italic;
    border-left: 3px solid var(--line);
    padding-left: 10px;
  }

  /* ---------- Overview ---------- */
  .ov-title{ font-size: 1.5rem; color: var(--green-deep); margin-bottom: 4px; }
  .ov-sub{ color: var(--ink-soft); font-size: 0.95rem; margin-bottom: 18px; }
  .timeline{ position: relative; padding-left: 22px; }
  .timeline::before{
    content:"";
    position:absolute; left:6px; top:6px; bottom:6px;
    width:2px; background: var(--line);
  }
  .tl-item{
    position:relative;
    padding-bottom: 20px;
    cursor:pointer;
  }
  .tl-item:last-child{ padding-bottom:0; }
  .tl-item::before{
    content:"";
    position:absolute; left:-22px; top:4px;
    width:11px; height:11px; border-radius:50%;
    background: var(--gold);
    border: 2px solid var(--white);
    box-shadow: 0 0 0 1px var(--gold);
  }
  .tl-item .tl-day{ font-size:0.78rem; font-weight:700; color:var(--rust); }
  .tl-item .tl-name{ font-family:'Fraunces', serif; font-weight:600; font-size:1.05rem; color:var(--green-deep); }
  .tl-item .tl-loc{ font-size:0.87rem; color:var(--ink-soft); }

  footer{
    text-align:center;
    font-size: 0.8rem;
    color: var(--ink-soft);
    padding: 26px 18px 10px;
  }

  @media (max-width: 380px){
    body{ font-size: 16px; }
    header h1{ font-size: 1.45rem; }
  }
</style>
</head>

/* ---------------- RENDER ---------------- */
function gmaps(q){ return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q); }
function amaps(q){ return "https://maps.apple.com/?q=" + encodeURIComponent(q); }

function placeCard(p){
  return `
  <div class="place">
    <div class="pname">${p.name}</div>
    <div class="paddr">${p.addr}</div>
    <div class="pdesc">${p.desc}</div>
    <div class="plinks">
      <a href="${gmaps(p.addr)}" target="_blank" rel="noopener">Google Maps</a>
      <a href="${amaps(p.addr)}" target="_blank" rel="noopener">Apple Maps</a>
      <a href="${p.url}" target="_blank" rel="noopener">More info</a>
    </div>
  </div>`;
}

function renderDay(d){
  const kickerClass = d.kickerClass === "travel" ? "kicker travel" : "kicker";
  let html = `
    <div class="day-head">
      <div class="${kickerClass}">${d.kicker}</div>
      <h2>${d.title}</h2>
      <div class="note">${d.note}</div>
    </div>
    <div class="stay-card">
      ${ICONS.bed}
      <div>
        <div class="label">Staying at</div>
        <div class="name">${d.stay.name}</div>
        <div class="addr">${d.stay.addr}</div>
        <div class="maplinks">
          <a href="${gmaps(d.stay.addr)}" target="_blank" rel="noopener">Google Maps</a>
          <a href="${amaps(d.stay.addr)}" target="_blank" rel="noopener">Apple Maps</a>
        </div>
      </div>
    </div>
  `;

  if(d.enroute){
    if(d.enroute.food.length){
      html += `<section class="block">
        <div class="block-title">${ICONS.food} Food along the way</div>
        <span class="enroute-tag">En route</span>
        ${d.enroute.food.map(placeCard).join("")}
      </section>`;
    }
    if(d.enroute.sights.length){
      html += `<section class="block">
        <div class="block-title">${ICONS.compass} Sights along the way</div>
        <span class="enroute-tag">En route</span>
        ${d.enroute.sights.map(placeCard).join("")}
      </section>`;
    }
  }

  if(d.food.length){
    html += `<section class="block">
      <div class="block-title">${ICONS.food} Food picks</div>
      ${d.food.map(placeCard).join("")}
    </section>`;
  }
  if(d.sights.length){
    html += `<section class="block">
      <div class="block-title">${ICONS.compass} Hidden gems &amp; sights</div>
      ${d.sights.map(placeCard).join("")}
    </section>`;
  }
  if(!d.food.length && !d.sights.length && !(d.enroute && (d.enroute.food.length || d.enroute.sights.length))){
    html += `<p class="empty-note">Nothing else lined up \u2014 an open, unplanned stretch.</p>`;
  }

  document.getElementById("main").innerHTML = html;
}

function renderOverview(){
  let html = `
    <h2 class="ov-title">Trip overview</h2>
    <div class="ov-sub">Tap a day to jump straight to it.</div>
    <div class="timeline">
      ${DAYS.map(d => `
        <div class="tl-item" data-day="${d.num}">
          <div class="tl-day">${d.kicker}</div>
          <div class="tl-name">${d.stay.name}</div>
          <div class="tl-loc">${d.stay.addr.split(",").slice(-2).join(",").trim()}</div>
        </div>
      `).join("")}
    </div>
  `;
  document.getElementById("main").innerHTML = html;
  document.querySelectorAll(".tl-item").forEach(el => {
    el.addEventListener("click", () => selectDay(parseInt(el.dataset.day)));
  });
}

function buildNav(){
  const nav = document.getElementById("dayNav");
  let html = `<button class="overview-btn" data-target="overview">Overview</button>`;
  DAYS.forEach(d => {
    html += `<button data-target="${d.num}">${d.num}</button>`;
  });
  nav.innerHTML = html;
  nav.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      const t = btn.dataset.target;
      if(t === "overview"){ selectOverview(); }
      else { selectDay(parseInt(t)); }
    });
  });
}

function setActiveButton(target){
  document.querySelectorAll("#dayNav button").forEach(b => {
    b.classList.toggle("active", b.dataset.target == target);
  });
}

function selectDay(n){
  const d = DAYS.find(x => x.num === n);
  renderDay(d);
  setActiveButton(n);
  window.scrollTo({top:0, behavior:"instant"});
}

function selectOverview(){
  renderOverview();
  setActiveButton("overview");
  window.scrollTo({top:0, behavior:"instant"});
}

buildNav();
selectOverview();
</script>
</body>
</html>
